// === CROSSHAIR (LAPTOP) — `exec crosshair_laptop` on the laptop, `exec crosshair` to go back ===
// Same black plus, 3x: ROG Zephyrus M16 at 2560x1600 renders the pixel values at 1600/533 = 3x,
// a 15px plus with 3px lines, ~2 mm — the 1080 pin gave 1.48x (~1 mm, blurry 1.48px lines)
// while the club's 24" 1080p shows ~1.4 mm. Keep the scale a whole number so lines stay sharp:
// 800 = 2x, 533 = 3x at 1600; 600 = 2x, 400 = 3x at 1920x1200.
exec crosshair
cl_crosshair_screen_height 533
