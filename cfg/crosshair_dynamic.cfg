// === CROSSHAIR (TESTING) — `exec crosshair_dynamic` to try, `exec crosshair` to go back ===
// Same tiny plus as crosshair.cfg, but the bars move out with the weapon's real spread
// (moving/jumping/spraying) and stay closed when a shot is accurate.
exec crosshair
cl_crosshairstyle 0                                // dynamic cross
cl_crosshair_dynamic_spread_limit 8                // max px the bars travel (default 255 = up to ~64px); tune 4-12
