// === CROSSHAIR (TESTING) — `exec crosshair_dynamic` to try, `exec crosshair` to go back ===
// Same tiny plus as crosshair.cfg at rest (uses its gap), kicks out only on shots.
// Style 0/7 were rejected: they draw real weapon spread, which is never 0 even standing still,
// so the gap never closes regardless of cl_crosshair_gap.
exec crosshair
cl_crosshairstyle 5                                // Dynamic Cross (Legacy/Shot Feedback)
