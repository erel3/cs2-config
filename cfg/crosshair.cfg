// === CROSSHAIR === tiny solid black plus (Rush Hour pixel system, Sep 2026)
// length/thickness/gap are pixels at cl_crosshair_screen_height; the game rescales
// them to the real resolution, so pinning 1080 makes these numbers mean the same everywhere.
cl_crosshair_screen_height 1080
cl_crosshairstyle 4                                // static cross
cl_crosshair_length 2                              // old size 1.5 + gap -5 = 5px plus at 1080p
cl_crosshair_thickness 1
cl_crosshair_gap 0
cl_crosshairdot 1                                  // fills the center pixel at gap 0
cl_crosshair_t 0
cl_crosshair_recoil 0
cl_crosshair_drawoutline 0                         // 0 none, 1 full, 2 half
cl_crosshaircolor_r 0
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_friendly_warning 1
cl_show_observer_crosshair 2                       // show everyone's crosshairs
